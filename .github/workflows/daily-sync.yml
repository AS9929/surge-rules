name: Daily Sync Upstream (fallback)

# 公开仓备用：私有仓 AS9929/vps-infra 的 Sync Surge Rulesets 为每日主路径。
# 仅保留手动触发，避免与私有仓定时任务双写冲突。
# 本文件由 publish-rulesets.sh 从私有仓 configs/rulesets/daily-sync.workflow.yml 同步。

on:
  workflow_dispatch:

concurrency:
  group: daily-sync-upstream
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install pyyaml

      - name: Fetch upstream & merge owned
        run: python3 sync-rulesets.py

      - name: Commit & push if changed
        run: |
          git config user.name "AS9929"
          git config user.email "noreply@github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "无变更"
          else
            git commit -m "chore: sync Surge rulesets $(date -u +%Y-%m-%d)"
            git push
          fi
